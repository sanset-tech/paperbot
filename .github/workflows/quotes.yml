name: Prezzi in diretta

on:
  schedule:
    # CICLI (principali): un job lungo che ripete i prezzi ogni 15 min con sleep, così non dipende
    # dal cron di GitHub (diagnosi 21/11: solo 10 esecuzioni programmate su 38 al giorno).
    # 10:31 -> 17:50 UTC e 16:01 -> 21:15 UTC. Ogni ciclo dura al massimo 350 min (timeout 358).
    # Orari anticipati il 25/11: GitHub ha fatto partire il cron "1 12" alle 13:12 (23/11) e 13:11 (24/11),
    # quindi niente prezzi pre-apertura tra le 12:00 e le 13:10. Con ~70 min di ritardo il primo ciclo parte
    # verso le 11:40; il secondo resta in coda (gruppo prezzi-ciclo) e parte appena finisce il primo.
    - cron: "31 10 * * 1-5"
    - cron: "1 16 * * 1-5"
    # RISERVA: un giro singolo; salta da solo se un ciclo ha aggiornato i prezzi negli ultimi 10 minuti.
    # Minuti "dispari" (non :00/:15/:30/:45): GitHub rinvia o salta spesso le esecuzioni a orari tondi.
    - cron: "7,22,37,52 13-21 * * 1-5"
    - cron: "3,33 12 * * 1-5"
  workflow_dispatch:
    inputs:
      ciclo_fino_a:
        description: "Facoltativo: ripeti ogni 15 min fino a HH:MM UTC (vuoto = un giro solo)"
        required: false
        default: ""

permissions:
  contents: write

# Gruppo proprio (prima era 'paperbot', condiviso col bot: un ciclo di ore avrebbe bloccato il bot).
# I cicli non si sovrappongono tra loro; i giri di riserva hanno un gruppo unico e non restano in coda.
concurrency:
  group: ${{ (github.event.schedule == '31 10 * * 1-5' || github.event.schedule == '1 16 * * 1-5') && 'prezzi-ciclo' || format('prezzi-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.schedule == '31 10 * * 1-5' || github.event.schedule == '1 16 * * 1-5' || github.event.inputs.ciclo_fino_a != '') && 358 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # sempre l'ultima versione, anche se l'esecuzione era rimasta in coda

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install pandas numpy yfinance

      - name: Prezzi e candele (ciclo o giro singolo) e pubblicazione
        run: |
          case "${{ github.event.schedule }}" in
            "31 10 * * 1-5") bash scripts/ciclo_prezzi.sh 17:50 ;;
            "1 16 * * 1-5")  bash scripts/ciclo_prezzi.sh 21:15 ;;
            "")  # avvio manuale: un giro sempre, oppure un ciclo fino all'ora indicata
                 if [ -n "${{ github.event.inputs.ciclo_fino_a }}" ]; then bash scripts/ciclo_prezzi.sh "${{ github.event.inputs.ciclo_fino_a }}"
                 else SALTA_SE_MIN=0 bash scripts/ciclo_prezzi.sh singolo; fi ;;
            *)               bash scripts/ciclo_prezzi.sh singolo ;;
          esac
