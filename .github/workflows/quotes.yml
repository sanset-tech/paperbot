name: Prezzi in diretta

on:
  schedule:
    # Minuti "dispari" (non :00/:15/:30/:45): GitHub rinvia o salta spesso le
    # esecuzioni a orari tondi. Seduta USA ogni 15 min (UTC, copre ora solare e legale).
    - cron: "7,22,37,52 13-21 * * 1-5"
    # Pre-apertura ridondante: il briefing (13:47 UTC) deve trovare futures freschi
    - cron: "3,33 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paperbot
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # sempre l'ultima versione, anche se l'esecuzione era rimasta in coda

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install pandas numpy yfinance

      - name: Scarica i prezzi
        run: python live_quotes.py

      - name: Candele e pattern per il Laboratorio
        run: python lab_data.py || echo "candele non aggiornate"

      - name: Pubblica i prezzi
        run: |
          git config user.name "paperbot"
          git config user.email "paperbot@users.noreply.github.com"
          git add docs/live.json
          git add docs/lab_data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Prezzi invariati"
          else
            git commit -q -m "Prezzi e candele $(date -u +'%H:%M') UTC"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin main && git push -q && break
              echo "push rifiutato, nuovo tentativo"; sleep 5
            done
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "::error::salvataggio non riuscito"; exit 1; }
          fi
