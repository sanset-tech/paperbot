name: Ricerca strategie

# Solo sul branch ricerca-strategie: backtest di 5 strategie alternative con dati giornalieri pubblici.
# Il bot NON viene modificato: run_backtest.py gira invariato solo per avere la sua equity di confronto.
# Nessuna chiave Alpaca, nessun ordine. Risultati salvati su QUESTO branch.

on:
  push:
    branches: [ricerca-strategie]
    paths: ["ricerca/**", ".github/workflows/ricerca_strategie.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ricerca-strategie
  cancel-in-progress: false

jobs:
  ricerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pandas numpy yfinance
      - name: Backtest del bot attuale (invariato, solo per confronto)
        run: python run_backtest.py --out out_bot --tactical off > /dev/null
      - name: Ricerca
        run: python ricerca/lab.py --out ricerca/risultati --bot-equity out_bot/equity.csv 2>&1 | tee ricerca/risultati_log.txt
      - name: Salva risultati sul branch
        if: always()
        run: |
          mkdir -p ricerca/risultati && mv -f ricerca/risultati_log.txt ricerca/risultati/log.txt || true
          git config user.name "paperbot-ricerca"
          git config user.email "actions@users.noreply.github.com"
          git add ricerca/risultati
          git commit -m "Risultati ricerca strategie" || exit 0
          git push
