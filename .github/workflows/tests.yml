name: Test

on:
  push:
    paths: ["bot/**", "tests/**", "*.py", "config.json"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance alpaca-py pytest
      - run: python -m pytest -q tests
