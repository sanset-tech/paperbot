name: Paperbot

on:
  schedule:
    # Orari in UTC. 22:15 UTC = 23:15 in Italia d'inverno (00:15 d'estate): dopo la chiusura di Wall Street.
    - cron: "15 22 * * 1-5"
    # Tentativi di riserva: se il primo fallisce (Yahoo non risponde) recuperano; se è andato bene non fanno nulla.
    - cron: "45 23 * * 1-5"
    - cron: "15 6 * * 2-6"
  workflow_dispatch:
    inputs:
      azione:
        description: "Cosa fare"
        type: choice
        default: esegui
        options:
          - esegui
          - aggiorna_solo_dashboard
          - riattiva_dopo_kill_switch
          - backtest

permissions:
  contents: write

concurrency:
  group: paperbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Aggiornamenti in arrivo (estrae bundle.txt se presente)
        run: |
          if [ -f bundle.txt ]; then
          python3 - <<'PY'
          import hashlib, pathlib, re, sys
          txt = open("bundle.txt", encoding="utf-8").read().replace("\r\n", "\n")
          parts = re.split(r"^#==== (FILE|PATCH): (\S+) sha256=([0-9a-f]{64})\n", txt, flags=re.M)
          bad, todo = [], {}
          for i in range(1, len(parts), 4):
              kind, path, h, body = parts[i], parts[i + 1], parts[i + 2], parts[i + 3]
              p = pathlib.Path(path)
              if kind == "FILE":
                  new = body.rstrip("\n")
              else:
                  new = p.read_text(encoding="utf-8").rstrip("\n")
                  for old, rep in re.findall(r"<<<<<<< OLD\n(.*?)\n=======\n(.*?)\n>>>>>>> NEW\n", body, flags=re.S):
                      if new.count(old) != 1:
                          bad.append(path)
                          break
                      new = new.replace(old, rep)
              if hashlib.sha256(new.encode()).hexdigest() != h:
                  bad.append(path)
              todo[p] = new
          if bad:
              print("ERRORE, file non integri, nessuna modifica:", sorted(set(bad)))
              sys.exit(1)
          for p, new in todo.items():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(new + "\n" if new else "", encoding="utf-8")
          print("file aggiornati:", len(todo))
          PY
          git rm -q bundle.txt
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install pandas numpy yfinance

      - name: Riattiva dopo kill switch
        if: github.event.inputs.azione == 'riattiva_dopo_kill_switch'
        run: python run_paper.py --unhalt

      - name: Backtest su dati reali (risultati in reports/)
        if: github.event.inputs.azione == 'backtest'
        run: |
          python run_backtest.py --out reports/dal_2005 > /dev/null
          python run_backtest.py --start 2015-01-01 --out reports/dal_2015 > /dev/null
          python run_backtest.py --start 2021-01-01 --out reports/dal_2021 > /dev/null
          ls -R reports

      - name: Esegui il bot
        id: bot
        if: github.event.inputs.azione != 'aggiorna_solo_dashboard' && github.event.inputs.azione != 'backtest'
        continue-on-error: true
        run: python run_paper.py

      - name: Aggiorna dashboard
        run: python make_dashboard.py

      - name: Salva stato e dashboard nel repository
        run: |
          git config user.name "paperbot"
          git config user.email "paperbot@users.noreply.github.com"
          git add -A
          git reset -q -- reports/*/equity.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Paperbot: aggiornamento $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Segnala errore
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::Il bot non ha completato l'esecuzione. Guarda il passo 'Esegui il bot'."
          exit 1
